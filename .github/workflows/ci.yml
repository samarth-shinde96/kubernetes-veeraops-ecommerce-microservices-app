name: CI/CD for Shopping Site (Frontend + Backend)

on:
  workflow_dispatch:

  push:
    branches:
      - main

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com

  FRONTEND_SERVICES: "main appliances auto beauty books computers earphones electronics fashion food furniture googlegrocery googlemusic googlepay home mobiles sports toys two-wheelers"
  BACKEND_SERVICE: "backend"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}

      # -------------------------
      # AWS Credentials
      # -------------------------
      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # Setup Docker Buildx
      # -------------------------
      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------
      # ECR Login
      # -------------------------
      - name: 📦 Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------
      # Debug Repo Structure
      # -------------------------
      - name: 🐞 Debug Folder Structure
        run: |
          echo "Current Directory:"
          pwd

          echo "Repository Files:"
          ls -la

          echo "Frontend folders:"
          ls -la frontend || true

          echo "Backend folder:"
          ls -la backend || true

      # -------------------------
      # Build & Push Images
      # -------------------------
      - name: 🛠 Build and Push Docker Images
        run: |
          set -e

          IMAGE_TAG="${GITHUB_SHA}"

          # -------- Frontend --------
          for service in $FRONTEND_SERVICES; do

            FOLDER="frontend/$service"
            REPO_NAME="shopping-site-$service"
            IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

            echo "----------------------------------"
            echo "🚀 Processing Service: $service"
            echo "📁 Folder: $FOLDER"

            if [ ! -d "$FOLDER" ]; then
              echo "❌ Folder not found: $FOLDER"
              continue
            fi

            if [ ! -f "$FOLDER/Dockerfile" ]; then
              echo "⚠️ Dockerfile missing in $FOLDER"
              continue
            fi

            echo "📂 Folder files:"
            ls -la "$FOLDER"

            aws ecr describe-repositories --repository-names $REPO_NAME >/dev/null 2>&1 || \
              aws ecr create-repository \
                --repository-name $REPO_NAME \
                --image-scanning-configuration scanOnPush=true

            echo "🐳 Building Docker image..."

            docker buildx build \
              --platform linux/amd64 \
              -f "$FOLDER/Dockerfile" \
              -t "$IMAGE_URI" \
              "$FOLDER" \
              --push

            if [ -f "$FOLDER/deployment.yml" ]; then
              sed -i "s|image:.*|image: $IMAGE_URI|g" "$FOLDER/deployment.yml"
            fi

          done

          # -------- Backend --------
          FOLDER="backend"
          REPO_NAME="shopping-site-backend"
          IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

          echo "----------------------------------"
          echo "🚀 Processing Backend"

          if [ ! -d "$FOLDER" ]; then
            echo "❌ Backend folder missing"
            exit 1
          fi

          if [ ! -f "$FOLDER/Dockerfile" ]; then
            echo "❌ Backend Dockerfile missing"
            exit 1
          fi

          echo "📂 Backend files:"
          ls -la "$FOLDER"

          aws ecr describe-repositories --repository-names $REPO_NAME >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name $REPO_NAME \
              --image-scanning-configuration scanOnPush=true

          echo "🐳 Building Backend Image..."

          docker buildx build \
            --platform linux/amd64 \
            -f "$FOLDER/Dockerfile" \
            -t "$IMAGE_URI" \
            "$FOLDER" \
            --push

          if [ -f "$FOLDER/backend-deployment.yml" ]; then
            sed -i "s|image:.*|image: $IMAGE_URI|g" "$FOLDER/backend-deployment.yml"
          fi

      # -------------------------
      # Commit YAML changes
      # -------------------------
      - name: 🔄 Commit updated YAML files
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add frontend/**/deployment.yml backend/backend-deployment.yml

          git commit -m "🔄 Update image tags after build [skip ci]" || echo "No changes"

          git push origin main || echo "Nothing to push"

      # -------------------------
      # Prevent CI loop
      # -------------------------
      - name: 🧠 Skip loop if commit was automated
        if: contains(github.event.head_commit.message, '[skip ci]')
        run: echo "Skipping re-triggered build"
