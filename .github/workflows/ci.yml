name: CI/CD for Shopping Site (Frontend + Backend)

on:
  workflow_dispatch:

  push:
    branches:
      - main

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com

  FRONTEND_SERVICES: "main appliances auto beauty books computers earphones electronics fashion food furniture googlegrocery googlemusic googlepay home mobiles sports toys two-wheelers"

permissions:
  contents: write

jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------
      # Checkout Repository
      # -----------------------------------
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}

      # -----------------------------------
      # Configure AWS Credentials
      # -----------------------------------
      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------
      # Login to Amazon ECR
      # -----------------------------------
      - name: 📦 Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------
      # Docker Debug
      # -----------------------------------
      - name: 🐳 Docker Debug
        run: |
          docker --version
          docker info

      # -----------------------------------
      # Debug Repository Structure
      # -----------------------------------
      - name: 🐞 Debug Folder Structure
        run: |
          echo "Current Directory:"
          pwd

          echo "Repository Files:"
          ls -la

          echo "Frontend folders:"
          ls -la frontend || true

          echo "Backend folder:"
          ls -la backend || true

      # -----------------------------------
      # Build and Push Docker Images
      # -----------------------------------
      - name: 🛠 Build and Push Docker Images
        run: |
          set -e

          IMAGE_TAG="${GITHUB_SHA}"

          echo "Using Image Tag: $IMAGE_TAG"

          # ===================================
          # FRONTEND SERVICES
          # ===================================
          for service in $FRONTEND_SERVICES; do

            FOLDER="frontend/$service"
            REPO_NAME="shopping-site-$service"
            IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

            echo "======================================"
            echo "🚀 Processing Frontend Service: $service"
            echo "📁 Folder: $FOLDER"
            echo "🖼 Image URI: $IMAGE_URI"

            # Folder Check
            if [ ! -d "$FOLDER" ]; then
              echo "❌ Folder not found: $FOLDER"
              continue
            fi

            # Dockerfile Check
            if [ ! -f "$FOLDER/Dockerfile" ]; then
              echo "❌ Dockerfile missing in $FOLDER"
              continue
            fi

            echo "📂 Folder Files:"
            ls -la "$FOLDER"

            # Create ECR Repository if not exists
            aws ecr describe-repositories \
              --repository-names "$REPO_NAME" \
              >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$REPO_NAME" \
              --image-scanning-configuration scanOnPush=true

            # Build Docker Image
            echo "🐳 Building Docker image..."

            docker build \
              --platform linux/amd64 \
              -f "$FOLDER/Dockerfile" \
              -t "$IMAGE_URI" \
              "$FOLDER"

            # Push Docker Image
            echo "📤 Pushing Docker image..."

            docker push "$IMAGE_URI"

            # Update Deployment YAML
            if [ -f "$FOLDER/deployment.yml" ]; then

              echo "📝 Updating deployment.yml"

              sed -i "/image:/c\        image: $IMAGE_URI" "$FOLDER/deployment.yml"

            fi

          done

          # ===================================
          # BACKEND SERVICE
          # ===================================
          FOLDER="backend"
          REPO_NAME="shopping-site-backend"
          IMAGE_URI="$ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG"

          echo "======================================"
          echo "🚀 Processing Backend Service"
          echo "📁 Folder: $FOLDER"

          # Folder Check
          if [ ! -d "$FOLDER" ]; then
            echo "❌ Backend folder missing"
            exit 1
          fi

          # Dockerfile Check
          if [ ! -f "$FOLDER/Dockerfile" ]; then
            echo "❌ Backend Dockerfile missing"
            exit 1
          fi

          echo "📂 Backend Files:"
          ls -la "$FOLDER"

          # Create ECR Repository if not exists
          aws ecr describe-repositories \
            --repository-names "$REPO_NAME" \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$REPO_NAME" \
            --image-scanning-configuration scanOnPush=true

          # Build Backend Image
          echo "🐳 Building Backend Docker image..."

          docker build \
            --platform linux/amd64 \
            -f "$FOLDER/Dockerfile" \
            -t "$IMAGE_URI" \
            "$FOLDER"

          # Push Backend Image
          echo "📤 Pushing Backend image..."

          docker push "$IMAGE_URI"

          # Update Backend Deployment YAML
          if [ -f "$FOLDER/backend-deployment.yml" ]; then

            echo "📝 Updating backend-deployment.yml"

            sed -i "/image:/c\        image: $IMAGE_URI" "$FOLDER/backend-deployment.yml"

          fi

      # -----------------------------------
      # Commit Updated YAML Files
      # -----------------------------------
      - name: 🔄 Commit updated YAML files
        run: |

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Add frontend deployment files
          find frontend -name "deployment.yml" -exec git add {} \;

          # Add backend deployment file
          git add backend/backend-deployment.yml || true

          # Commit Changes
          git commit -m "🔄 Update image tags after build [skip ci]" || echo "No changes to commit"

          # Push Changes
          git push origin main || echo "Nothing to push"

      # -----------------------------------
      # Success Message
      # -----------------------------------
      - name: ✅ Deployment Complete
        run: |
          echo "🎉 CI/CD Pipeline completed successfully"
